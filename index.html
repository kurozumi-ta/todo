<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TODO</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 32rem; margin: 2rem auto; padding: 0 1rem; }
  form { display: flex; gap: .5rem; }
  input[type=text] { flex: 1; padding: .5rem; font-size: 1rem; }
  ul { list-style: none; padding: 0; }
  li { display: flex; align-items: center; gap: .5rem; padding: .4rem 0; border-bottom: 1px solid #ddd; }
  li span { flex: 1; overflow-wrap: anywhere; }
  li.done span { text-decoration: line-through; color: #888; }
</style>
</head>
<body>
<h1>TODO</h1>
<form id="add">
  <input type="text" id="text" aria-label="新しいTODO" placeholder="やることを入力" required>
  <button>追加</button>
</form>
<ul id="list"></ul>
<script>
const form = document.getElementById('add');
const input = document.getElementById('text');
const list = document.getElementById('list');

let todos;
try { todos = JSON.parse(localStorage.getItem('todos')) || []; } catch { todos = []; }
const save = () => { try { localStorage.setItem('todos', JSON.stringify(todos)); } catch {} };

function render() {
  list.replaceChildren(...todos.map((t, i) => {
    const li = document.createElement('li');
    li.className = t.done ? 'done' : '';

    const check = document.createElement('input');
    check.type = 'checkbox';
    check.checked = t.done;
    check.setAttribute('aria-label', `完了: ${t.text}`);
    check.onchange = () => { t.done = check.checked; update(); };

    const span = document.createElement('span');
    span.textContent = t.text;

    const del = document.createElement('button');
    del.textContent = '削除';
    del.setAttribute('aria-label', `削除: ${t.text}`);
    del.onclick = () => { todos.splice(i, 1); update(); };

    li.append(check, span, del);
    return li;
  }));
}

function update() { save(); render(); }

form.onsubmit = e => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  todos.push({ text, done: false });
  input.value = '';
  update();
};

render();
</script>
</body>
</html>
